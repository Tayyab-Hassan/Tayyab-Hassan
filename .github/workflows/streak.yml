name: Update GitHub Streak

on:
  schedule:
    # Every day at 01:00 UTC
    - cron: "0 1 * * *"

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      # ============================================================
      # GENERATE STREAK SVG
      # ============================================================

      - name: Generate GitHub Streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Tayyab-Hassan

        run: |

          python3 <<'PY'

          import os
          import json
          import urllib.request
          from datetime import date, timedelta
          from pathlib import Path

          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GH_TOKEN"]

          START_YEAR = 2022
          TODAY = date.today()
          CURRENT_YEAR = TODAY.year

          GRAPHQL_URL = "https://api.github.com/graphql"

          # ==========================================================
          # GRAPHQL QUERY
          # ==========================================================

          QUERY = """
          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {
            user(login: $login) {
              contributionsCollection(
                from: $from,
                to: $to
              ) {
                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          # ==========================================================
          # GITHUB GRAPHQL REQUEST
          # ==========================================================

          def github_request(from_date, to_date):

              payload = json.dumps({
                  "query": QUERY,
                  "variables": {
                      "login": USERNAME,
                      "from": f"{from_date}T00:00:00Z",
                      "to": f"{to_date}T23:59:59Z"
                  }
              }).encode("utf-8")

              request = urllib.request.Request(
                  GRAPHQL_URL,
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "Tayyab-Hassan-GitHub-Streak"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # ==========================================================
          # FETCH CONTRIBUTIONS
          # ==========================================================

          all_days = {}

          print()
          print("=" * 70)
          print("GITHUB CONTRIBUTION DATA")
          print("=" * 70)
          print(f"Username : {USERNAME}")
          print(f"Start    : {START_YEAR}")
          print(f"End      : {CURRENT_YEAR}")
          print()

          for year in range(
              START_YEAR,
              CURRENT_YEAR + 1
          ):

              from_date = date(
                  year,
                  1,
                  1
              )

              if year == CURRENT_YEAR:

                  to_date = TODAY

              else:

                  to_date = date(
                      year,
                      12,
                      31
                  )

              print(
                  f"Fetching {year}: "
                  f"{from_date} -> {to_date}"
              )

              try:

                  result = github_request(
                      from_date.isoformat(),
                      to_date.isoformat()
                  )

              except Exception as error:

                  print()
                  print(
                      f"ERROR while fetching {year}:"
                  )
                  print(error)

                  raise SystemExit(1)

              # ======================================================
              # GRAPHQL ERRORS
              # ======================================================

              if "errors" in result:

                  print()
                  print(
                      "GitHub GraphQL API Error:"
                  )

                  print(
                      json.dumps(
                          result["errors"],
                          indent=2
                      )
                  )

                  raise SystemExit(1)

              # ======================================================
              # USER
              # ======================================================

              user = (
                  result
                  .get("data", {})
                  .get("user")
              )

              if user is None:

                  raise SystemExit(
                      f"GitHub user '{USERNAME}' "
                      f"was not found."
                  )

              # ======================================================
              # CALENDAR
              # ======================================================

              calendar = (
                  user[
                      "contributionsCollection"
                  ][
                      "contributionCalendar"
                  ]
              )

              year_total = (
                  calendar[
                      "totalContributions"
                  ]
              )

              print(
                  f"  Contributions: "
                  f"{year_total}"
              )

              # ======================================================
              # DAILY CONTRIBUTIONS
              # ======================================================

              for week in calendar["weeks"]:

                  for contribution_day in (
                      week["contributionDays"]
                  ):

                      contribution_date = (
                          date.fromisoformat(
                              contribution_day["date"]
                          )
                      )

                      contribution_count = (
                          contribution_day[
                              "contributionCount"
                          ]
                      )

                      all_days[
                          contribution_date
                      ] = contribution_count

          # ==========================================================
          # LIFETIME TOTAL
          # ==========================================================

          lifetime_total = sum(
              all_days.values()
          )

          print()
          print("=" * 70)
          print(
              "Lifetime Contributions:",
              lifetime_total
          )

          # ==========================================================
          # CURRENT STREAK
          #
          # If there is no contribution today,
          # start from yesterday.
          # ==========================================================

          current_streak = 0

          if all_days.get(TODAY, 0) > 0:

              cursor = TODAY

          else:

              cursor = (
                  TODAY -
                  timedelta(days=1)
              )

          while all_days.get(
              cursor,
              0
          ) > 0:

              current_streak += 1

              cursor -= timedelta(days=1)

          print(
              "Current Streak:",
              current_streak,
              "days"
          )

          # ==========================================================
          # LONGEST STREAK
          # ==========================================================

          longest_streak = 0

          longest_start = None
          longest_end = None

          temporary_streak = 0
          temporary_start = None

          previous_contribution_day = None

          for current_day in sorted(
              all_days.keys()
          ):

              contribution_count = (
                  all_days[current_day]
              )

              # ------------------------------------------------------
              # Contribution exists
              # ------------------------------------------------------

              if contribution_count > 0:

                  if (
                      temporary_streak == 0
                      or previous_contribution_day is None
                      or current_day != (
                          previous_contribution_day
                          + timedelta(days=1)
                      )
                  ):

                      temporary_streak = 1

                      temporary_start = (
                          current_day
                      )

                  else:

                      temporary_streak += 1

                  # --------------------------------------------------
                  # Save longest streak
                  # --------------------------------------------------

                  if (
                      temporary_streak
                      > longest_streak
                  ):

                      longest_streak = (
                          temporary_streak
                      )

                      longest_start = (
                          temporary_start
                      )

                      longest_end = (
                          current_day
                      )

                  previous_contribution_day = (
                      current_day
                  )

              else:

                  temporary_streak = 0

                  temporary_start = None

                  previous_contribution_day = (
                      None
                  )

          print(
              "Longest Streak:",
              longest_streak,
              "days"
          )

          # ==========================================================
          # LONGEST STREAK DATE RANGE
          # ==========================================================

          if (
              longest_start is not None
              and longest_end is not None
          ):

              if (
                  longest_start.year
                  ==
                  longest_end.year
              ):

                  longest_range = (
                      f"{longest_start.strftime('%b %-d')}"
                      f" - "
                      f"{longest_end.strftime('%b %-d, %Y')}"
                  )

              else:

                  longest_range = (
                      f"{longest_start.strftime('%b %-d, %Y')}"
                      f" - "
                      f"{longest_end.strftime('%b %-d, %Y')}"
                  )

          else:

              longest_range = "No streak yet"

          # ==========================================================
          # PROFESSIONAL SVG
          # ==========================================================

          svg = f'''<svg
            width="900"
            height="300"
            viewBox="0 0 900 300"
            xmlns="http://www.w3.org/2000/svg"
          >

            <defs>

              <linearGradient
                id="bg"
                x1="0"
                y1="0"
                x2="900"
                y2="300"
                gradientUnits="userSpaceOnUse"
              >
                <stop
                  offset="0"
                  stop-color="#0D1117"
                />

                <stop
                  offset="1"
                  stop-color="#161B22"
                />
              </linearGradient>

              <linearGradient
                id="green"
                x1="0"
                y1="0"
                x2="900"
                y2="0"
                gradientUnits="userSpaceOnUse"
              >
                <stop
                  offset="0"
                  stop-color="#39D353"
                />

                <stop
                  offset="1"
                  stop-color="#26A641"
                />
              </linearGradient>

              <filter
                id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%"
              >

                <feDropShadow
                  dx="0"
                  dy="8"
                  stdDeviation="12"
                  flood-opacity="0.25"
                />

              </filter>

            </defs>

            <!-- Main Card -->

            <rect
              x="10"
              y="10"
              width="880"
              height="280"
              rx="22"
              fill="url(#bg)"
              stroke="#30363D"
              stroke-width="1"
              filter="url(#shadow)"
            />

            <!-- Top Green Accent -->

            <rect
              x="10"
              y="10"
              width="880"
              height="5"
              rx="2.5"
              fill="url(#green)"
            />

            <!-- Header -->

            <text
              x="45"
              y="58"
              fill="#F0F6FC"
              font-family="Arial, Helvetica, sans-serif"
              font-size="24"
              font-weight="700"
            >
              GitHub Contribution Streak
            </text>

            <text
              x="45"
              y="84"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
            >
              github.com/{USERNAME}
            </text>

            <!-- Current Streak -->

            <rect
              x="45"
              y="115"
              width="250"
              height="100"
              rx="16"
              fill="#161B22"
              stroke="#30363D"
            />

            <text
              x="68"
              y="148"
              fill="#39D353"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
              font-weight="700"
            >
              CURRENT STREAK
            </text>

            <text
              x="68"
              y="188"
              fill="#F0F6FC"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="700"
            >
              {current_streak}
            </text>

            <text
              x="118"
              y="187"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
            >
              days
            </text>

            <!-- Longest Streak -->

            <rect
              x="325"
              y="115"
              width="250"
              height="100"
              rx="16"
              fill="#161B22"
              stroke="#30363D"
            />

            <text
              x="348"
              y="148"
              fill="#58A6FF"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
              font-weight="700"
            >
              LONGEST STREAK
            </text>

            <text
              x="348"
              y="188"
              fill="#F0F6FC"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="700"
            >
              {longest_streak}
            </text>

            <text
              x="405"
              y="187"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
            >
              days
            </text>

            <text
              x="348"
              y="204"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="10"
            >
              {longest_range}
            </text>

            <!-- Total Contributions -->

            <rect
              x="605"
              y="115"
              width="250"
              height="100"
              rx="16"
              fill="#161B22"
              stroke="#30363D"
            />

            <text
              x="628"
              y="148"
              fill="#D29922"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
              font-weight="700"
            >
              CONTRIBUTIONS
            </text>

            <text
              x="628"
              y="188"
              fill="#F0F6FC"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="700"
            >
              {lifetime_total}
            </text>

            <text
              x="628"
              y="204"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="10"
            >
              {START_YEAR} - {CURRENT_YEAR}
            </text>

            <!-- Footer Line -->

            <line
              x1="45"
              y1="240"
              x2="855"
              y2="240"
              stroke="#30363D"
            />

            <!-- ATSpark -->

            <text
              x="45"
              y="267"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
            >
              ⭐ ATSpark — Spark Your Digital Future
            </text>

            <!-- Updated -->

            <text
              x="855"
              y="267"
              text-anchor="end"
              fill="#39D353"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
              font-weight="600"
            >
              Updated automatically
            </text>

          </svg>'''

          # ==========================================================
          # SAVE SVG
          # ==========================================================

          output_directory = Path("assets")

          output_directory.mkdir(
              parents=True,
              exist_ok=True
          )

          output_file = (
              output_directory /
              "github-streak.svg"
          )

          output_file.write_text(
              svg,
              encoding="utf-8"
          )

          # ==========================================================
          # FINAL RESULTS
          # ==========================================================

          print()
          print("=" * 70)
          print("FINAL RESULTS")
          print("=" * 70)

          print(
              f"Lifetime Contributions : "
              f"{lifetime_total}"
          )

          print(
              f"Current Streak         : "
              f"{current_streak} days"
          )

          print(
              f"Longest Streak         : "
              f"{longest_streak} days"
          )

          print(
              f"Longest Streak Range   : "
              f"{longest_range}"
          )

          print(
              f"GitHub Since           : "
              f"{START_YEAR}"
          )

          print(
              f"SVG                    : "
              f"{output_file}"
          )

          print("=" * 70)

          PY

      # ============================================================
      # COMMIT AND PUSH
      # ============================================================

      - name: Commit and Push Updated Streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-streak.svg

          # ========================================================
          # If there is nothing to commit
          # ========================================================

          if git diff --cached --quiet; then

            echo "No changes to github-streak.svg"

            exit 0

          fi

          git commit \
            -m "chore: update GitHub contribution streak"

          # ========================================================
          # PUSH WITH RETRY
          #
          # This handles the situation where another commit reaches
          # main while this workflow is running.
          # ========================================================

          MAX_RETRIES=5
          RETRY=1

          while [ "$RETRY" -le "$MAX_RETRIES" ]; do

            echo ""
            echo "=============================================="
            echo "Push attempt $RETRY/$MAX_RETRIES"
            echo "=============================================="

            # Get latest remote branch
            git fetch origin main

            # Rebase our commit on latest remote main
            if ! git rebase origin/main; then

              echo "Rebase conflict detected."

              git rebase --abort || true

              echo "Refreshing repository..."

              git reset --hard origin/main

              # Regenerate SVG will happen only on a new workflow,
              # so retry cannot safely continue after conflict.
              echo "Please run the workflow again."

              exit 1

            fi

            # Try pushing
            if git push origin HEAD:main; then

              echo ""
              echo "=============================================="
              echo "SUCCESS"
              echo "GitHub streak SVG pushed successfully."
              echo "=============================================="

              exit 0

            fi

            echo ""
            echo "Push was rejected."
            echo "Remote branch changed. Retrying..."

            RETRY=$((RETRY + 1))

            sleep 3

          done

          echo ""
          echo "Failed to push after $MAX_RETRIES attempts."

          exit 1
