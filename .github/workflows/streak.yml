name: Update GitHub Streak

on:
  schedule:
    # Every day at 01:00 UTC
    - cron: "0 1 * * *"

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main


      # ============================================================
      # GENERATE STREAK SVG
      #
      # IMPORTANT (root cause of broken streaks):
      # The default `secrets.GITHUB_TOKEN` is scoped only to THIS repo
      # and runs as the github-actions[bot] identity. It cannot see your
      # contributions in other (especially private) repos, so days where
      # you actually pushed code can come back as 0 contributions and
      # incorrectly break your streak.
      #
      # Fix: create a classic Personal Access Token with the `read:user`
      # scope (add `repo` too if you want private contributions counted),
      # save it as a repo secret named STREAK_PAT, and make sure
      # "Include private contributions on my profile" is enabled in your
      # GitHub profile settings. The line below automatically prefers
      # STREAK_PAT and safely falls back to GITHUB_TOKEN if it isn't set.
      # ============================================================

      - name: Generate GitHub Streak
        env:
          GH_TOKEN: ${{ secrets.STREAK_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Tayyab-Hassan

        run: |

          python3 <<'PY'

          import os
          import json
          import urllib.request

          from datetime import date, timedelta
          from pathlib import Path


          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          USERNAME = os.environ["GITHUB_USERNAME"]
          TOKEN = os.environ["GH_TOKEN"]

          START_YEAR = 2022
          TODAY = date.today()
          CURRENT_YEAR = TODAY.year

          GRAPHQL_URL = "https://api.github.com/graphql"


          # ==========================================================
          # GRAPHQL QUERY
          # ==========================================================

          QUERY = """
          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {
            user(login: $login) {
              contributionsCollection(
                from: $from,
                to: $to
              ) {
                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      color
                    }
                  }
                }
              }
            }
          }
          """


          # ==========================================================
          # GITHUB GRAPHQL REQUEST
          # ==========================================================

          def github_request(from_date, to_date):

              payload = json.dumps({
                  "query": QUERY,
                  "variables": {
                      "login": USERNAME,
                      "from": f"{from_date}T00:00:00Z",
                      "to": f"{to_date}T23:59:59Z"
                  }
              }).encode("utf-8")


              request = urllib.request.Request(
                  GRAPHQL_URL,
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "Tayyab-Hassan-GitHub-Streak"
                  },
                  method="POST"
              )


              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # ==========================================================
          # FETCH CONTRIBUTIONS
          # ==========================================================

          all_days = {}

          print()
          print("=" * 70)
          print("GITHUB CONTRIBUTION DATA")
          print("=" * 70)
          print(f"Username : {USERNAME}")
          print(f"Start    : {START_YEAR}")
          print(f"End      : {CURRENT_YEAR}")
          print()


          for year in range(
              START_YEAR,
              CURRENT_YEAR + 1
          ):

              from_date = date(
                  year,
                  1,
                  1
              )


              if year == CURRENT_YEAR:

                  to_date = TODAY

              else:

                  to_date = date(
                      year,
                      12,
                      31
                  )


              print(
                  f"Fetching {year}: "
                  f"{from_date} -> {to_date}"
              )


              try:

                  result = github_request(
                      from_date.isoformat(),
                      to_date.isoformat()
                  )

              except Exception as error:

                  print()
                  print(
                      f"ERROR while fetching {year}:"
                  )

                  print(error)

                  raise SystemExit(1)


              # ======================================================
              # GRAPHQL ERRORS
              # ======================================================

              if "errors" in result:

                  print()

                  print(
                      "GitHub GraphQL API Error:"
                  )

                  print(
                      json.dumps(
                          result["errors"],
                          indent=2
                      )
                  )

                  raise SystemExit(1)


              # ======================================================
              # USER
              # ======================================================

              user = (
                  result
                  .get("data", {})
                  .get("user")
              )


              if user is None:

                  raise SystemExit(
                      f"GitHub user '{USERNAME}' "
                      f"was not found."
                  )


              # ======================================================
              # CALENDAR
              # ======================================================

              calendar = (
                  user[
                      "contributionsCollection"
                  ][
                      "contributionCalendar"
                  ]
              )


              year_total = (
                  calendar[
                      "totalContributions"
                  ]
              )


              print(
                  f"  Contributions: "
                  f"{year_total}"
              )


              # ======================================================
              # DAILY CONTRIBUTIONS
              # ======================================================

              for week in calendar["weeks"]:

                  for contribution_day in (
                      week["contributionDays"]
                  ):

                      contribution_date = (
                          date.fromisoformat(
                              contribution_day["date"]
                          )
                      )


                      contribution_count = (
                          contribution_day[
                              "contributionCount"
                          ]
                      )


                      contribution_color = (
                          contribution_day.get(
                              "color",
                              "#161B22"
                          )
                      )


                      all_days[
                          contribution_date
                      ] = {
                          "count":
                              contribution_count,

                          "color":
                              contribution_color
                      }


          # ==========================================================
          # GAP-FILL SAFETY NET
          #
          # Guarantees every single day between START_YEAR-01-01 and
          # TODAY exists in all_days (defaulting to 0 contributions if
          # GitHub's response ever omits one). This prevents a missing
          # dictionary key from silently and incorrectly breaking a
          # streak calculation.
          # ==========================================================

          fill_cursor = date(START_YEAR, 1, 1)

          while fill_cursor <= TODAY:

              if fill_cursor not in all_days:

                  all_days[fill_cursor] = {
                      "count": 0,
                      "color": "#161B22"
                  }

              fill_cursor += timedelta(days=1)


          # ==========================================================
          # LIFETIME TOTAL
          # ==========================================================

          lifetime_total = sum(
              item["count"]
              for item in all_days.values()
          )


          print()
          print("=" * 70)
          print(
              "Lifetime Contributions:",
              lifetime_total
          )


          # ==========================================================
          # CURRENT STREAK
          #
          # Counts consecutive days (walking backward from today) where
          # contribution count > 0. Stops the moment a day with 0
          # contributions is hit. If today has no contributions yet
          # (e.g. the workflow ran before you pushed anything), it
          # starts counting from yesterday instead so an in-progress
          # day doesn't falsely reset the streak.
          # ==========================================================

          current_streak = 0


          if (
              all_days
              .get(TODAY, {})
              .get("count", 0)
              > 0
          ):

              cursor = TODAY

          else:

              cursor = (
                  TODAY -
                  timedelta(days=1)
              )


          while (
              all_days
              .get(cursor, {})
              .get("count", 0)
              > 0
          ):

              current_streak += 1

              cursor -= timedelta(
                  days=1
              )


          print(
              "Current Streak:",
              current_streak,
              "days"
          )


          # ==========================================================
          # LONGEST STREAK
          #
          # Walks every day in chronological order. Every time a day
          # has a contribution AND directly follows the previous
          # contribution day, the running streak grows by 1. Any gap
          # (a 0-contribution day) resets the running streak back to 0.
          # The single highest running streak ever seen becomes the
          # longest streak (independent of the current streak).
          # ==========================================================

          longest_streak = 0

          longest_start = None
          longest_end = None

          running_streak = 0
          running_start = None

          previous_contribution_day = None


          for current_day in sorted(
              all_days.keys()
          ):

              contribution_count = (
                  all_days[
                      current_day
                  ]["count"]
              )


              # ------------------------------------------------------
              # Contribution exists -> extend or start a running streak
              # ------------------------------------------------------

              if contribution_count > 0:

                  is_consecutive = (
                      previous_contribution_day is not None
                      and
                      current_day == (
                          previous_contribution_day
                          +
                          timedelta(days=1)
                      )
                  )


                  if is_consecutive:

                      running_streak += 1

                  else:

                      running_streak = 1

                      running_start = current_day


                  # --------------------------------------------------
                  # Record the new best streak seen so far
                  # --------------------------------------------------

                  if running_streak > longest_streak:

                      longest_streak = running_streak

                      longest_start = running_start

                      longest_end = current_day


                  previous_contribution_day = current_day


              # ------------------------------------------------------
              # No contribution -> the running streak is broken
              # ------------------------------------------------------

              else:

                  running_streak = 0

                  running_start = None

                  previous_contribution_day = None


          print(
              "Longest Streak:",
              longest_streak,
              "days"
          )


          # ==========================================================
          # LONGEST STREAK DATE RANGE
          # ==========================================================

          if (
              longest_start is not None
              and
              longest_end is not None
          ):

              if (
                  longest_start.year
                  ==
                  longest_end.year
              ):

                  longest_range = (
                      f"{longest_start.strftime('%b %-d')}"
                      f" - "
                      f"{longest_end.strftime('%b %-d, %Y')}"
                  )

              else:

                  longest_range = (
                      f"{longest_start.strftime('%b %-d, %Y')}"
                      f" - "
                      f"{longest_end.strftime('%b %-d, %Y')}"
                  )

          else:

              longest_range = "No streak yet"


          # ==========================================================
          # PREMIUM SVG DESIGN
          #
          # ONLY DESIGN IS CHANGED HERE.
          # CALCULATION LOGIC ABOVE REMAINS THE SAME.
          # ==========================================================

          WIDTH = 1200
          HEIGHT = 730


          # ----------------------------------------------------------
          # Build contribution grid
          #
          # Last ~1 year of REAL GitHub contribution data.
          # ----------------------------------------------------------

          calendar_end = TODAY

          calendar_start = (
              calendar_end
              -
              timedelta(days=364)
          )


          # Align to Sunday.

          calendar_start -= timedelta(
              days=(
                  calendar_start.weekday() + 1
              ) % 7
          )


          calendar_days = []

          cursor = calendar_start


          while cursor <= calendar_end:

              calendar_days.append(cursor)

              cursor += timedelta(
                  days=1
              )


          weeks = []

          current_week = []


          for day in calendar_days:

              current_week.append(day)

              if len(current_week) == 7:

                  weeks.append(
                      current_week
                  )

                  current_week = []


          if current_week:

              while len(current_week) < 7:

                  current_week.append(None)

              weeks.append(
                  current_week
              )


          # ==========================================================
          # SVG HELPERS
          # ==========================================================

          def esc(value):

              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
                  .replace("'", "&apos;")
              )


          # ==========================================================
          # SVG START
          # ==========================================================

          svg = f'''<svg
            width="100%"
            viewBox="0 0 {WIDTH} {HEIGHT}"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="GitHub Contribution Streak Dashboard">

            <defs>

              <!-- Main background -->

              <linearGradient
                id="background"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                  offset="0%"
