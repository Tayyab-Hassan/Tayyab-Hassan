name: Update GitHub Streak

on:
  schedule:
    # Run every day at 01:00 UTC
    - cron: "0 1 * * *"

  # Allows you to run it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout latest repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Generate GitHub Streak SVG
      # ============================================================

      - name: Generate GitHub Streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Tayyab-Hassan

        run: |

          python3 <<'PY'

          import os
          import json
          import urllib.request
          from datetime import date, timedelta
          from pathlib import Path

          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GH_TOKEN"]

          START_YEAR = 2022
          TODAY = date.today()
          CURRENT_YEAR = TODAY.year

          GRAPHQL_URL = "https://api.github.com/graphql"

          # ==========================================================
          # GITHUB GRAPHQL QUERY
          # ==========================================================

          QUERY = """
          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {
            user(login: $login) {
              contributionsCollection(
                from: $from,
                to: $to
              ) {
                contributionCalendar {
                  totalContributions

                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          # ==========================================================
          # GITHUB API FUNCTION
          # ==========================================================

          def github_request(from_date, to_date):

              payload = json.dumps({
                  "query": QUERY,
                  "variables": {
                      "login": username,
                      "from": f"{from_date}T00:00:00Z",
                      "to": f"{to_date}T23:59:59Z"
                  }
              }).encode("utf-8")

              request = urllib.request.Request(
                  GRAPHQL_URL,
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "Tayyab-Hassan-GitHub-Streak"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  return json.loads(
                      response.read().decode("utf-8")
                  )

          # ==========================================================
          # FETCH CONTRIBUTIONS FROM 2022 → CURRENT YEAR
          # ==========================================================

          all_days = {}

          print()
          print("=" * 70)
          print("GITHUB CONTRIBUTION DATA")
          print("=" * 70)
          print(f"Username : {username}")
          print(f"From     : {START_YEAR}")
          print(f"To       : {CURRENT_YEAR}")
          print()

          for year in range(
              START_YEAR,
              CURRENT_YEAR + 1
          ):

              from_date = date(
                  year,
                  1,
                  1
              )

              if year == CURRENT_YEAR:

                  to_date = TODAY

              else:

                  to_date = date(
                      year,
                      12,
                      31
                  )

              print(
                  f"Fetching {year}: "
                  f"{from_date} → {to_date}"
              )

              result = github_request(
                  from_date.isoformat(),
                  to_date.isoformat()
              )

              # ======================================================
              # API ERROR
              # ======================================================

              if "errors" in result:

                  print()
                  print("GITHUB API ERROR:")
                  print(
                      json.dumps(
                          result["errors"],
                          indent=2
                      )
                  )

                  raise SystemExit(
                      "GitHub GraphQL API request failed."
                  )

              # ======================================================
              # USER CHECK
              # ======================================================

              user = (
                  result
                  .get("data", {})
                  .get("user")
              )

              if not user:

                  raise SystemExit(
                      f"GitHub user '{username}' was not found."
                  )

              calendar = (
                  user[
                      "contributionsCollection"
                  ][
                      "contributionCalendar"
                  ]
              )

              year_total = calendar[
                  "totalContributions"
              ]

              print(
                  f"  Contributions: {year_total}"
              )

              # ======================================================
              # SAVE DAILY CONTRIBUTIONS
              # ======================================================

              for week in calendar["weeks"]:

                  for contribution_day in (
                      week["contributionDays"]
                  ):

                      day_date = date.fromisoformat(
                          contribution_day["date"]
                      )

                      contribution_count = (
                          contribution_day[
                              "contributionCount"
                          ]
                      )

                      all_days[day_date] = (
                          contribution_count
                      )

          # ==========================================================
          # LIFETIME CONTRIBUTIONS
          # ==========================================================

          lifetime_total = sum(
              all_days.values()
          )

          print()
          print("=" * 70)
          print(
              f"Lifetime Contributions: "
              f"{lifetime_total}"
          )

          # ==========================================================
          # CURRENT STREAK
          #
          # If today has no contribution,
          # start checking from yesterday.
          # ==========================================================

          current_streak = 0

          if all_days.get(TODAY, 0) > 0:

              cursor = TODAY

          else:

              cursor = (
                  TODAY -
                  timedelta(days=1)
              )

          while (
              all_days.get(cursor, 0) > 0
          ):

              current_streak += 1

              cursor -= timedelta(
                  days=1
              )

          print(
              f"Current Streak: "
              f"{current_streak} days"
          )

          # ==========================================================
          # LONGEST STREAK
          # ==========================================================

          longest_streak = 0

          longest_start = None
          longest_end = None

          temp_streak = 0
          temp_start = None

          previous_day = None

          for current_day in sorted(
              all_days.keys()
          ):

              contribution = (
                  all_days[current_day]
              )

              # ------------------------------------------------------
              # Contribution exists
              # ------------------------------------------------------

              if contribution > 0:

                  # Start new streak if:
                  #
                  # 1. No previous streak
                  # OR
                  # 2. There is a date gap
                  #

                  if (
                      temp_streak == 0
                      or previous_day is None
                      or current_day != (
                          previous_day +
                          timedelta(days=1)
                      )
                  ):

                      temp_streak = 1

                      temp_start = (
                          current_day
                      )

                  else:

                      temp_streak += 1

                  # --------------------------------------------------
                  # Check longest streak
                  # --------------------------------------------------

                  if (
                      temp_streak >
                      longest_streak
                  ):

                      longest_streak = (
                          temp_streak
                      )

                      longest_start = (
                          temp_start
                      )

                      longest_end = (
                          current_day
                      )

                  previous_day = (
                      current_day
                  )

              # ------------------------------------------------------
              # No contribution
              # ------------------------------------------------------

              else:

                  temp_streak = 0
                  temp_start = None
                  previous_day = (
                      current_day
                  )

          print(
              f"Longest Streak: "
              f"{longest_streak} days"
          )

          # ==========================================================
          # FORMAT LONGEST STREAK DATE
          # ==========================================================

          if (
              longest_start
              and longest_end
          ):

              if (
                  longest_start.year
                  ==
                  longest_end.year
              ):

                  longest_range = (
                      f"{longest_start.strftime('%b %d')} "
                      f"- "
                      f"{longest_end.strftime('%b %d, %Y')}"
                  )

              else:

                  longest_range = (
                      f"{longest_start.strftime('%b %d, %Y')} "
                      f"- "
                      f"{longest_end.strftime('%b %d, %Y')}"
                  )

          else:

              longest_range = (
                  "No streak yet"
              )

          # Remove leading zero from dates
          longest_range = (
              longest_range
              .replace(" 0", " ")
          )

          # ==========================================================
          # GENERATE PROFESSIONAL SVG
          # ==========================================================

          svg = f'''<svg
            width="900"
            height="300"
            viewBox="0 0 900 300"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >

            <defs>

              <linearGradient
                id="background"
                x1="0"
                y1="0"
                x2="900"
                y2="300"
                gradientUnits="userSpaceOnUse"
              >
                <stop
                  stop-color="#0D1117"
                />

                <stop
                  offset="1"
                  stop-color="#161B22"
                />
              </linearGradient>

              <linearGradient
                id="accent"
                x1="0"
                y1="0"
                x2="900"
                y2="0"
                gradientUnits="userSpaceOnUse"
              >
                <stop
                  stop-color="#39D353"
                />

                <stop
                  offset="1"
                  stop-color="#26A641"
                />
              </linearGradient>

              <filter
                id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%"
              >

                <feDropShadow
                  dx="0"
                  dy="8"
                  stdDeviation="12"
                  flood-opacity="0.25"
                />

              </filter>

            </defs>


            <!-- ================================================= -->
            <!-- MAIN CARD -->
            <!-- ================================================= -->

            <rect
              x="10"
              y="10"
              width="880"
              height="280"
              rx="22"
              fill="url(#background)"
              stroke="#30363D"
              stroke-width="1"
              filter="url(#shadow)"
            />


            <!-- ================================================= -->
            <!-- TOP ACCENT -->
            <!-- ================================================= -->

            <rect
              x="10"
              y="10"
              width="880"
              height="5"
              rx="2.5"
              fill="url(#accent)"
            />


            <!-- ================================================= -->
            <!-- HEADER -->
            <!-- ================================================= -->

            <text
              x="45"
              y="58"
              fill="#F0F6FC"
              font-family="Arial, Helvetica, sans-serif"
              font-size="24"
              font-weight="700"
            >
              GitHub Contribution Streak
            </text>

            <text
              x="45"
              y="84"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
            >
              github.com/{username}
            </text>


            <!-- ================================================= -->
            <!-- CURRENT STREAK -->
            <!-- ================================================= -->

            <rect
              x="45"
              y="115"
              width="250"
              height="100"
              rx="16"
              fill="#161B22"
              stroke="#30363D"
            />

            <text
              x="68"
              y="148"
              fill="#39D353"
              font-family="Arial, Helvetica, sans-serif"
              font-size="15"
              font-weight="600"
            >
              CURRENT STREAK
            </text>

            <text
              x="68"
              y="187"
              fill="#F0F6FC"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="700"
            >
              {current_streak}
            </text>

            <text
              x="115"
              y="186"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
            >
              days
            </text>


            <!-- ================================================= -->
            <!-- LONGEST STREAK -->
            <!-- ================================================= -->

            <rect
              x="325"
              y="115"
              width="250"
              height="100"
              rx="16"
              fill="#161B22"
              stroke="#30363D"
            />

            <text
              x="348"
              y="148"
              fill="#58A6FF"
              font-family="Arial, Helvetica, sans-serif"
              font-size="15"
              font-weight="600"
            >
              LONGEST STREAK
            </text>

            <text
              x="348"
              y="187"
              fill="#F0F6FC"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="700"
            >
              {longest_streak}
            </text>

            <text
              x="405"
              y="186"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14"
            >
              days
            </text>

            <text
              x="348"
              y="204"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="10"
            >
              {longest_range}
            </text>


            <!-- ================================================= -->
            <!-- TOTAL CONTRIBUTIONS -->
            <!-- ================================================= -->

            <rect
              x="605"
              y="115"
              width="250"
              height="100"
              rx="16"
              fill="#161B22"
              stroke="#30363D"
            />

            <text
              x="628"
              y="148"
              fill="#D29922"
              font-family="Arial, Helvetica, sans-serif"
              font-size="15"
              font-weight="600"
            >
              CONTRIBUTIONS
            </text>

            <text
              x="628"
              y="187"
              fill="#F0F6FC"
              font-family="Arial, Helvetica, sans-serif"
              font-size="32"
              font-weight="700"
            >
              {lifetime_total}
            </text>

            <text
              x="628"
              y="204"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="10"
            >
              {START_YEAR} - {CURRENT_YEAR}
            </text>


            <!-- ================================================= -->
            <!-- FOOTER -->
            <!-- ================================================= -->

            <line
              x1="45"
              y1="240"
              x2="855"
              y2="240"
              stroke="#30363D"
            />

            <text
              x="45"
              y="267"
              fill="#8B949E"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
            >
              ⭐ ATSpark — Spark Your Digital Future
            </text>

            <text
              x="855"
              y="267"
              text-anchor="end"
              fill="#39D353"
              font-family="Arial, Helvetica, sans-serif"
              font-size="12"
              font-weight="600"
            >
              Updated automatically
            </text>

          </svg>'''

          # ==========================================================
          # SAVE SVG
          # ==========================================================

          output_dir = Path(
              "assets"
          )

          output_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          output_file = (
              output_dir /
              "github-streak.svg"
          )

          output_file.write_text(
              svg,
              encoding="utf-8"
          )

          # ==========================================================
          # FINAL OUTPUT
          # ==========================================================

          print()
          print("=" * 70)
          print("FINAL RESULTS")
          print("=" * 70)

          print(
              f"Lifetime Contributions : "
              f"{lifetime_total}"
          )

          print(
              f"Current Streak         : "
              f"{current_streak} days"
          )

          print(
              f"Longest Streak         : "
              f"{longest_streak} days"
          )

          print(
              f"Longest Streak Range   : "
              f"{longest_range}"
          )

          print(
              f"GitHub Since           : "
              f"{START_YEAR}"
          )

          print(
              f"SVG                    : "
              f"{output_file}"
          )

          print("=" * 70)

          PY

      # ============================================================
      # 3. Commit and Push SVG
      # ============================================================

      - name: Commit updated streak
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-streak.svg

          # --------------------------------------------------------
          # Check if SVG actually changed
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi

          # --------------------------------------------------------
          # Commit generated SVG
          # --------------------------------------------------------

          git commit \
            -m "chore: update GitHub contribution streak"

          # --------------------------------------------------------
          # Get latest main branch
          # --------------------------------------------------------

          git pull \
            --rebase \
            origin main

          # --------------------------------------------------------
          # Push updated SVG
          # --------------------------------------------------------

          git push \
            origin \
            HEAD:main
