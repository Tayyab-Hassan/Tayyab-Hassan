              "
              fill="#0D1724"
            />


            <text
              x="540"
              y="277"
              class="blue"
              font-size="18"
              font-weight="800">

              LONGEST STREAK

            </text>


            <text
              x="455"
              y="357"
              class="primary"
              font-size="56"
              font-weight="800">

              {longest_streak}

            </text>


            <text
              x="525"
              y="355"
              class="secondary"
              font-size="21">

              {"day" if longest_streak == 1 else "days"}

            </text>


            <line
              x1="455"
              y1="376"
              x2="745"
              y2="376"
              stroke="#203448"
              stroke-width="1"
              stroke-dasharray="4 5"
            />


            <text
              x="455"
              y="397"
              class="secondary"
              font-size="12">

              {esc(longest_range)}

            </text>


            <!-- Total -->

            <rect
              x="810"
              y="225"
              width="340"
              height="180"
              rx="20"
              class="panel-gold"
            />


            <circle
              cx="865"
              cy="280"
              r="38"
              fill="#2B2410"
            />


            <!-- Chart icon -->

            <rect
              x="845"
              y="284"
              width="8"
              height="20"
              rx="2"
              fill="#D29922"
            />

            <rect
