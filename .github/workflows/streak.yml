                />

                <stop
                  offset="55%"
                  stop-color="#0A131A"
                />

                <stop
                  offset="100%"
                  stop-color="#0C1720"
                />

              </linearGradient>


              <!-- Green accent -->

              <linearGradient
                id="greenAccent"
                x1="0"
                y1="0"
                x2="1"
                y2="0">

                <stop
                  offset="0%"
                  stop-color="#2EA043"
                />

                <stop
                  offset="50%"
                  stop-color="#39D353"
                />

                <stop
                  offset="100%"
                  stop-color="#26A641"
                />

              </linearGradient>


              <!-- Soft radial glow behind the header logo -->

              <radialGradient
                id="logoGlow"
                cx="50%"
                cy="50%"
                r="50%">

                <stop
                  offset="0%"
                  stop-color="#39D353"
                  stop-opacity="0.28"
                />

                <stop
                  offset="100%"
                  stop-color="#39D353"
                  stop-opacity="0"
                />

              </radialGradient>


              <!-- Sparkline -->

              <filter
                id="glow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feGaussianBlur
                  stdDeviation="7"
                  result="blur"
                />

                <feMerge>

                  <feMergeNode
                    in="blur"
                  />

                  <feMergeNode
                    in="SourceGraphic"
                  />

                </feMerge>

              </filter>


              <!-- Shadow -->

              <filter
                id="shadow"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%">

                <feDropShadow
                  dx="0"
                  dy="8"
                  stdDeviation="14"
                  flood-color="#000000"
                  flood-opacity="0.35"
                />

              </filter>


              <style>

                text {{
                  font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Arial,
                    Helvetica,
                    sans-serif;
                }}


                .primary {{
                  fill: #F0F6FC;
                }}


                .secondary {{
                  fill: #8B949E;
                }}


                .muted {{
                  fill: #6E7681;
                }}


                .green {{
                  fill: #39D353;
                }}


                .blue {{
                  fill: #58A6FF;
                }}


                .gold {{
                  fill: #D29922;
                }}


                .panel {{
                  fill: #0D171F;
                  stroke: #26323A;
                }}


                .panel-green {{
                  fill: #081B15;
                  stroke: #1B6339;
                }}


                .panel-blue {{
                  fill: #0A1826;
                  stroke: #1D527A;
                }}


                .panel-gold {{
                  fill: #1A1811;
                  stroke: #765818;
                }}


                @media (prefers-color-scheme: light) {{

                  .primary {{
                    fill: #1F2328;
                  }}

                  .secondary {{
                    fill: #656D76;
                  }}

                  .muted {{
                    fill: #8C959F;
                  }}

                  .panel {{
                    fill: #F6F8FA;
                    stroke: #D0D7DE;
                  }}

                  .panel-green {{
                    fill: #F0FFF4;
                    stroke: #1A7F37;
                  }}

                  .panel-blue {{
                    fill: #F0F7FF;
                    stroke: #0969DA;
                  }}

                  .panel-gold {{
                    fill: #FFF8E6;
                    stroke: #9A6700;
                  }}

                }}

              </style>

            </defs>


            <!-- ===================================================== -->
            <!-- MAIN CARD                                             -->
            <!-- ===================================================== -->

            <rect
              x="10"
              y="10"
              width="1180"
              height="710"
              rx="28"
              fill="url(#background)"
              stroke="#26323A"
              stroke-width="2"
              filter="url(#shadow)"
            />


            <!-- ===================================================== -->
            <!-- TOP GREEN BORDER                                      -->
            <!-- ===================================================== -->

            <rect
              x="10"
              y="10"
              width="1180"
              height="7"
              rx="4"
              fill="url(#greenAccent)"
            />


            <!-- ===================================================== -->
            <!-- HEADER                                                 -->
            <!-- ===================================================== -->

            <g transform="translate(50 55)">

              <circle
                cx="55"
                cy="55"
                r="80"
                fill="url(#logoGlow)"
              />


              <circle
                cx="55"
                cy="55"
                r="48"
                fill="#101A22"
                stroke="#4A555E"
                stroke-width="2"
              />


              <!-- GitHub icon -->

              <path
                d="
                  M55 29
                  C40 29 28 41 28 56
                  C28 68 36 78 47 82
                  C49 82.4 50 81.3 50 80
                  V74
                  C42 76
                  40 70
                  40 70
                  C38 65
                  35 64
                  35 64
                  C32 62
                  35 62
                  35 62
                  C38 62
                  37 67
                  43 69
                  C43 66
                  44 64
                  45 63
                  C38 62
                  31 59
                  31 50
                  C31 47
                  33 44
                  35 42
                  C35 39
                  35 36
                  36 34
                  C36 34
                  40 35
                  44 37
                  C47 36
                  50 36
                  55 36
                  C58 36
                  62 36
                  66 37
                  C70 35
                  74 34
                  74 34
                  C75 37
                  75 40
                  75 42
                  C77 44
                  79 47
                  79 50
                  C79 59
                  72 62
                  65 63
                  C67 65
                  68 68
                  68 72
                  V80
                  C68 81
                  69 82
                  70 82
                  C81 78
                  88 68
                  88 56
                  C88 41
                  70 29
                  55 29
                  Z
                "
                fill="#F0F6FC"
              />


              <!-- Green status dot -->

              <circle
                cx="93"
                cy="91"
                r="9"
                fill="#0B151D"
              />

              <circle
                cx="93"
                cy="91"
                r="6.5"
                fill="#39D353"
              />

            </g>


            <text
              x="175"
              y="92"
              class="primary"
              font-size="39"
              font-weight="800">

              GitHub Contribution Streak

            </text>


            <text
              x="175"
              y="130"
              class="secondary"
              font-size="20">

              github.com/{esc(USERNAME)}

            </text>


            <!-- ===================================================== -->
            <!-- TOP RIGHT CONTRIBUTION GRID                          -->
            <!-- ===================================================== -->

          '''


          # ----------------------------------------------------------
          # Contribution grid
          # ----------------------------------------------------------

          grid_x = 850
          grid_y = 48

          cell = 17
          gap = 7


          # Display 17 weeks x 7 days similar to provided design.

          display_weeks = weeks[-17:]


          for week_index, week in enumerate(
              display_weeks
          ):

              for day_index, day in enumerate(
                  week
              ):

                  if day is None:
                      continue


                  x = (
                      grid_x
                      +
                      week_index
                      *
                      (cell + gap)
                  )


                  y = (
                      grid_y
                      +
                      day_index
                      *
                      (cell + gap)
                  )


                  if day > TODAY:

                      color = "#071A12"

                      count = 0

                  else:

                      entry = (
                          all_days.get(
                              day,
                              {}
                          )
                      )

                      count = (
                          entry.get(
                              "count",
                              0
                          )
                      )

                      color = (
                          entry.get(
                              "color",
                              "#161B22"
                          )
                      )


                  svg += f'''
                  <rect
                    x="{x}"
                    y="{y}"
                    width="{cell}"
                    height="{cell}"
                    rx="5"
                    fill="{esc(color)}"
                    opacity="0.95">

                    <title>
                      {esc(day.isoformat())}: {count} contributions
                    </title>

                  </rect>
                  '''


          svg += f'''

            <!-- ===================================================== -->
            <!-- DIVIDER                                               -->
            <!-- ===================================================== -->

            <line
              x1="50"
              y1="195"
              x2="1150"
              y2="195"
              stroke="#243039"
              stroke-width="1"
              stroke-dasharray="4 6"
            />


            <!-- ===================================================== -->
            <!-- STAT CARDS                                             -->
            <!-- ===================================================== -->

            <!-- Current -->

            <rect
              x="50"
              y="225"
              width="340"
              height="180"
              rx="20"
              class="panel-green"
            />


            <circle
              cx="105"
              cy="280"
              r="38"
              fill="#0C2A20"
            />


            <!-- Flame icon (fits "streak" better than a lightning bolt) -->

            <path
              d="
                M105 250
                C 96 264, 88 273, 88 286
                C 88 301, 98 311, 111 311
                C 124 311, 133 302, 133 289
                C 133 280, 128 274, 122 270
                C 123 277, 119 282, 113 282
                C 107 282, 103 277, 104 270
                C 105 262, 111 257, 111 249
                C 108 250, 106 250, 105 250
                Z
              "
              fill="#39D353"
            />

            <path
              d="
                M111 292
                C 106 292, 102 296, 102 300
                C 102 305, 106 308, 111 308
                C 116 308, 120 305, 120 300
                C 120 297, 118 295, 116 293
                C 116 297, 113 299, 111 299
                C 109 299, 108 297, 109 294
                Z
              "
              fill="#0C2A20"
            />


            <text
              x="160"
              y="277"
              class="green"
              font-size="18"
              font-weight="800">

              CURRENT STREAK

            </text>


            <text
              x="75"
              y="357"
              class="primary"
              font-size="56"
              font-weight="800">

              {current_streak}

            </text>


            <text
              x="145"
              y="355"
              class="secondary"
              font-size="21">

              {"day" if current_streak == 1 else "days"}

            </text>


            <line
              x1="75"
              y1="376"
              x2="365"
              y2="376"
              stroke="#1E3430"
              stroke-width="1"
              stroke-dasharray="4 5"
            />


            <text
              x="75"
              y="397"
              class="secondary"
              font-size="13">

              Keep pushing! \U0001F4AA

            </text>


            <!-- Longest -->

            <rect
              x="430"
              y="225"
              width="340"
              height="180"
              rx="20"
              class="panel-blue"
            />


            <circle
              cx="485"
              cy="280"
              r="38"
              fill="#0D2540"
            />


            <!-- Medal icon -->

            <path
              d="
                M472 251
                H481
                L485 264
                L489 251
                H498
                L491 272
                V280
                H479
                V272
                Z
              "
              fill="#58A6FF"
            />


            <circle
              cx="485"
              cy="293"
              r="13"
              fill="#58A6FF"
            />


            <path
              d="
                M485 285
                L488 291
                L495 292
                L490 297
                L491 304
