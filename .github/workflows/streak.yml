      # ============================================================
      # COMMIT AND PUSH
      # ============================================================

      - name: Commit and Push Updated Streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add assets/github-streak.svg


          # Nothing changed.

          if git diff --cached --quiet; then

            echo "No changes to github-streak.svg"

            exit 0

          fi


          git commit \
            -m "chore: update GitHub contribution streak"


          # ========================================================
          # PUSH WITH RETRY
          # ========================================================

          MAX_RETRIES=5
          RETRY=1


          while [ "$RETRY" -le "$MAX_RETRIES" ]; do

            echo ""
            echo "=============================================="
            echo "Push attempt $RETRY/$MAX_RETRIES"
            echo "=============================================="


            git fetch origin main


            if ! git rebase origin/main; then

              echo "Rebase conflict detected."

              git rebase --abort || true

              echo "Please run the workflow again."

              exit 1

            fi


            if git push origin HEAD:main; then

              echo ""
              echo "=============================================="
              echo "SUCCESS"
              echo "=============================================="

              echo "GitHub streak SVG pushed successfully."

              exit 0

            fi


            echo ""
            echo "Push was rejected."
            echo "Remote branch changed. Retrying..."


            RETRY=$((RETRY + 1))

            sleep 3

          done


          echo ""
          echo "Failed to push after $MAX_RETRIES attempts."

          exit 1
