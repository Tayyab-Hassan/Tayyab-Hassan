          # ----------------------------------------------------------
          # Create activity sparkline from recent contribution data.
          # No fake contribution numbers are used.
          # ----------------------------------------------------------

          recent_start = (
              TODAY
              -
              timedelta(days=30)
          )


          recent_counts = []


          cursor = recent_start


          while cursor <= TODAY:

              recent_counts.append(
                  all_days
                  .get(cursor, {})
                  .get("count", 0)
              )

              cursor += timedelta(
                  days=1
              )


          max_count = max(
              recent_counts
              or [1]
          )


          points = []


          spark_x = 790
          spark_y = 510
          spark_width = 285
          spark_height = 55


          for index, value in enumerate(
              recent_counts
          ):

              if len(recent_counts) <= 1:

                  x = spark_x

              else:

                  x = (
                      spark_x
                      +
                      (
                          index
                          /
                          (
                              len(recent_counts)
                              - 1
                          )
                      )
                      *
                      spark_width
                  )


              if max_count == 0:

                  normalized = 0

              else:

                  normalized = (
                      value
                      /
                      max_count
                  )


              y = (
                  spark_y
                  +
                  spark_height
                  -
                  (
                      normalized
                      *
                      spark_height
                  )
              )


              points.append(
                  f"{x:.1f},{y:.1f}"
              )


          polyline_points = " ".join(
              points
          )


          # Current contribution endpoint.

          final_x = (
              spark_x
              +
              spark_width
          )


          final_value = (
              recent_counts[-1]
              if recent_counts
              else 0
          )


          if max_count == 0:

              final_normalized = 0

          else:

              final_normalized = (
                  final_value
                  /
                  max_count
              )


          final_y = (
              spark_y
              +
              spark_height
              -
              (
                  final_normalized
                  *
                  spark_height
              )
          )


          svg += f'''

            <polyline
              points="{polyline_points}"
              fill="none"
              stroke="#26A641"
              stroke-width="4"
              stroke-linecap="round"
