<svg
  width="900"
  height="300"
  viewBox="0 0 900 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="900"
      y2="300"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>

    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="900"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#39D353"/>
      <stop offset="1" stop-color="#26A641"/>
    </linearGradient>

    <filter
      id="shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="12"
        flood-opacity="0.25"
      />
    </filter>

  </defs>

  <!-- Main Card -->
  <rect
    x="10"
    y="10"
    width="880"
    height="280"
    rx="22"
    fill="url(#background)"
    stroke="#30363D"
    stroke-width="1"
    filter="url(#shadow)"
  />

  <!-- Top Accent -->
  <rect
    x="10"
    y="10"
    width="880"
    height="5"
    rx="2.5"
    fill="url(#accent)"
  />

  <!-- Header -->
  <text
    x="45"
    y="58"
    fill="#F0F6FC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="700"
  >
    GitHub Contribution Streak
  </text>

  <text
    x="45"
    y="84"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
  >
    github.com/Tayyab-Hassan
  </text>

  <!-- Current Streak -->
  <rect
    x="45"
    y="115"
    width="250"
    height="100"
    rx="16"
    fill="#161B22"
    stroke="#30363D"
  />

  <text
    x="68"
    y="148"
    fill="#39D353"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
  >
    CURRENT STREAK
  </text>

  <text
    x="68"
    y="187"
    fill="#F0F6FC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="32"
    font-weight="700"
  >
    1
  </text>

  <text
    x="115"
    y="186"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
  >
    days
  </text>

  <!-- Longest Streak -->
  <rect
    x="325"
    y="115"
    width="250"
    height="100"
    rx="16"
    fill="#161B22"
    stroke="#30363D"
  />

  <text
    x="348"
    y="148"
    fill="#58A6FF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
  >
    LONGEST STREAK
  </text>

  <text
    x="348"
    y="187"
    fill="#F0F6FC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="32"
    font-weight="700"
  >
    2
  </text>

  <text
    x="405"
    y="186"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
  >
    days
  </text>

  <text
    x="348"
    y="204"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
  >
    Mar 3 - Mar 4, 2026
  </text>

  <!-- Lifetime Contributions -->
  <rect
    x="605"
    y="115"
    width="250"
    height="100"
    rx="16"
    fill="#161B22"
    stroke="#30363D"
  />

  <text
    x="628"
    y="148"
    fill="#D29922"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
  >
    CONTRIBUTIONS
  </text>

  <text
    x="628"
    y="187"
    fill="#F0F6FC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="32"
    font-weight="700"
  >
    56
  </text>

  <text
    x="628"
    y="204"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
  >
    2022 - 2026
  </text>

  <!-- Footer -->
  <line
    x1="45"
    y1="240"
    x2="855"
    y2="240"
    stroke="#30363D"
  />

  <text
    x="45"
    y="267"
    fill="#8B949E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
  >
    ⭐ ATSpark — Spark Your Digital Future
  </text>

  <text
    x="855"
    y="267"
    text-anchor="end"
    fill="#39D353"
    font-family="Arial, Helvetica, sans-serif"
    font-size="12"
    font-weight="600"
  >
    Updated automatically
  </text>

</svg>